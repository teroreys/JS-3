 <script language="JavaScript">
        function obliczenia () {
        var D1_Mov=prompt("Podaj pierwszy dzien miesiąca:","");
        var G1_Mov=prompt("Podaj pierwszą godzine dnia:","");
        var D2_Mov=prompt("Podaj drugi dzien miesiąca:","");
        var G2_Mov=prompt("Podaj drugą godzine dnia:","");
        var a=parseFloat(D1_Mov);
        var b=parseFloat(D2_Mov);
        var c=parseFloat(G1_Mov);
        var d=parseFloat(G2_Mov);
        var sekund = ((a*24+c) - (b*24+d)) * 3600;
        document.write(("Tyle minęło czasu między tymi dniami : " + sekund + " sekund.").fontcolor("green").fontsize(42)); }

            function okno_zamknij_movchan() { 
            window.close(); 
        } 
 </script>
 </head>
<body>
    <div> <button onclick="obliczenia()">Oblicz</button> </div>
