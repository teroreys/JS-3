function obliczenia () {
    var liczba = prompt("Podaj mianownik:", "");
    var m_mov = parseFloat(liczba);
    document.write(("m = " + m_mov + "<br>").fontcolor("green").fontsize(42));
    var m1 = m_mov + 2;
    var m2 = (m_mov + 1) * (m_mov + 2);
    var m3 = m_mov * (m_mov + 1);
    document.write(("1/" + m_mov + " = 1/" + m1 + " + 1/" + m2 + " + 1/" + m3 + "<br>").fontcolor("green").fontsize(42)); 
}
