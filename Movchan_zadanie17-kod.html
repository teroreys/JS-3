<h2>Co to jest funkcja?</h2>

    <ul>
        <li>
            Jest to zbiór zgrupowanych instrukcji, które możemy uruchamiać poprzez podanie ich nazwy.
        </li>
        <li>
            Każda funkcja po wywołaniu wykonuje swój wewnętrzny kod.
        </li>
        <li>
            Funkcja może mieć argumenty, które wchodzą do wnętrza funkcji i są tam przetwarzane np. suma_kry(a, b)
        </li>
        <li>
             Może(nie zawsze) zwrócić obliczoną wartość zapisaną po słowie kluczowym <b> return </b>
        </li>
    </ul>
    <h2><u>Wybrane metody obiektu document</u></h2>
    <div>
<table>

wartości atrybutu id </td></tr>
	<tr><td>getElementByTagName("znacznik ") </td><td>dostęp do wszystkich elementów o typie
znacznika, np. P lub DIV </td></tr>
